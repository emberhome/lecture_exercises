version: '3.9'
services:
  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

  master:
    image: locustio/locust
    ports:
     - "8089:8089"
    volumes:
      - ./:/mnt/locust
    command: -f /mnt/locust/locust.py --master -H http://load_testing_demo-webapi-1:8000

  worker:
    image: locustio/locust
    volumes:
      - ./:/mnt/locust
    command: -f /mnt/locust/locust.py --worker --master-host master
